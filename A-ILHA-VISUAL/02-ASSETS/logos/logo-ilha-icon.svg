<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="icon-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="icon-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="icon-grad-side1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#071829"/>
    </linearGradient>
    <linearGradient id="icon-grad-side2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#02213a"/>
    </linearGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Flutuante -->
  <path d="M 50 50 L 90 70 L 50 90 L 10 70 Z" fill="url(#icon-grad-top)"/>
  <path d="M 10 70 L 50 90 L 50 98 L 10 78 Z" fill="url(#icon-grad-side1)"/>
  <path d="M 50 90 L 90 70 L 90 78 L 50 98 Z" fill="url(#icon-grad-side2)"/>

  <!-- Núcleo de Dados -->
  <path d="M 50 25 L 75 38 L 50 51 L 25 38 Z" fill="url(#icon-grad-core)" filter="url(#icon-glow)"/>
  <path d="M 25 38 L 50 51 L 50 62 L 25 49 Z" fill="#0284c7"/>
  <path d="M 50 51 L 75 38 L 75 49 L 50 62 Z" fill="#0369a1"/>

  <!-- Holograma Superior -->
  <circle cx="50" cy="18" r="4" fill="#ffffff" filter="url(#icon-glow)"/>
  <line x1="50" y1="18" x2="50" y2="28" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="2 2"/>
</svg>
