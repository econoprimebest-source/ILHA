<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Componentes: Botões · A ILHA</title>
  <link rel="stylesheet" href="../../01-DESIGN-SYSTEM/tokens/tokens.css">
  <link rel="stylesheet" href="../../01-DESIGN-SYSTEM/tipografia/tipografia.css">
  <link rel="stylesheet" href="../../05-PROTOTIPO/style.css">
</head>
<body style="padding: 32px; background: var(--ilh-bg-app);">
  <h1 class="text-hero" style="font-size: 22px; margin-bottom: 20px;">Família de Botões</h1>

  <div style="display: flex; flex-direction: column; gap: 16px; max-width: 400px;">
    <div>
      <span class="text-caption">Botão Primário</span><br>
      <button class="btn btn-primary">Explorar A Ilha</button>
    </div>

    <div>
      <span class="text-caption">Botão Secundário</span><br>
      <button class="btn btn-secondary">Configurar Parâmetros</button>
    </div>

    <div>
      <span class="text-caption">Botão Destrutivo</span><br>
      <button class="btn btn-danger">Excluir Ambiente</button>
    </div>

    <div>
      <span class="text-caption">Botão Pequeno (sm)</span><br>
      <button class="btn btn-primary btn-sm">Ação Rápida</button>
    </div>

    <div>
      <span class="text-caption">Botões de Ícone Circular</span><br>
      <div style="display:flex; gap:10px; margin-top:4px;">
        <button class="icon-btn">🎯</button>
        <button class="icon-btn">🌙</button>
        <button class="icon-btn">📱</button>
      </div>
    </div>
  </div>
</body>
</html>
