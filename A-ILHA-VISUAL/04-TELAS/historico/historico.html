<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela I: Histórico e Atividade · A ILHA</title>
  <link rel="stylesheet" href="../../01-DESIGN-SYSTEM/tokens/tokens.css">
  <link rel="stylesheet" href="../../01-DESIGN-SYSTEM/tipografia/tipografia.css">
  <link rel="stylesheet" href="../../05-PROTOTIPO/style.css">
</head>
<body style="padding: 24px; background: var(--ilh-bg-app); color: var(--ilh-text-title);">

  <div style="max-width: 500px; margin: 0 auto; display:flex; flex-direction:column; gap:16px;">
    <h1 class="text-hero" style="font-size: 22px;">Histórico de Atividades</h1>

    <div style="display:flex; flex-direction:column; gap:12px;">
      <div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--ilh-border-subtle);">
        <span style="font-size:22px;">🛡️</span>
        <div>
          <strong>Cofre Financeiro Bloqueado</strong>
          <p class="text-caption">Bloqueio automático por inatividade de 15 minutos.</p>
          <span class="app-chip" style="font-size:10px; margin-top:4px;">Hoje, 17:42</span>
        </div>
      </div>

      <div style="display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--ilh-border-subtle);">
        <span style="font-size:22px;">💬</span>
        <div>
          <strong>Slack aberto no Trabalho</strong>
          <p class="text-caption">Sessão iniciada no contêiner corporativo.</p>
          <span class="app-chip" style="font-size:10px; margin-top:4px;">Hoje, 16:15</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
