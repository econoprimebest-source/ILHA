<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tela F: Central de Apps · A ILHA</title>
  <link rel="stylesheet" href="../../01-DESIGN-SYSTEM/tokens/tokens.css">
  <link rel="stylesheet" href="../../01-DESIGN-SYSTEM/tipografia/tipografia.css">
  <link rel="stylesheet" href="../../05-PROTOTIPO/style.css">
</head>
<body style="padding: 24px; background: var(--ilh-bg-app); color: var(--ilh-text-title);">

  <div style="max-width: 500px; margin: 0 auto; display:flex; flex-direction:column; gap:16px;">
    <h1 class="text-hero" style="font-size: 22px;">Central de Aplicativos</h1>
    <input type="text" class="form-input" placeholder="🔍 Buscar aplicativo...">

    <div class="env-card" style="padding:14px; display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; gap:12px; align-items:center;">
        <span style="font-size:26px;">💬</span>
        <div>
          <strong>Slack</strong>
          <p class="text-caption">Produtividade · 48 MB</p>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm">Instalar em...</button>
    </div>

    <div class="env-card" style="padding:14px; display:flex; justify-content:space-between; align-items:center;">
      <div style="display:flex; gap:12px; align-items:center;">
        <span style="font-size:26px;">🟣</span>
        <div>
          <strong>Nubank</strong>
          <p class="text-caption">Finanças · 82 MB</p>
        </div>
      </div>
      <button class="btn btn-secondary btn-sm">Instalar em...</button>
    </div>
  </div>

</body>
</html>
