<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Painel da Ilha</title>
<style>
:root{--bg:#0b1020;--p:#141b33;--p2:#1b2447;--b:#2a3566;--t:#eef2ff;--m:#93a0cf;--a:#ffb347}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:auto;min-height:100dvh}
header{position:sticky;top:0;background:var(--p);border-bottom:1px solid var(--b);padding:10px 14px;z-index:2}
header b{font-size:1.05rem}header small{display:block;color:var(--m);margin-top:2px}
.missoes{padding:10px 12px;border-bottom:1px solid var(--b)}
.missoes h2{font-size:.75rem;color:var(--m);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.missao{background:var(--p2);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:.88rem;display:flex;justify-content:space-between;gap:8px}
.missao.alto{border-left:4px solid #ff3b5c}.missao.baixo{border-left:4px solid #4cff8a}
.acao{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
select,button{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--b);border-radius:8px;padding:8px 10px}
button{cursor:pointer}button:active{border-color:var(--a)}
ul{list-style:none;padding:10px 12px}
li{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;line-height:1.35;animation:e .35s ease}
li .i{font-size:1.3rem}li small{display:block;color:var(--m);font-size:.72rem;margin-top:2px}
li.missao-i{border-color:#6b4fd8}li.diretor{border-color:#ff6b86}
@keyframes e{from{opacity:0;transform:translateY(-8px)}}
.vazio{color:var(--m);text-align:center;padding:30px}
</style></head><body>
<header><b>🏝️ Painel da Ilha</b><small id="resumo">conectando…</small></header>
<section class="missoes">
  <h2>🧭 Missões</h2><div id="ativas"></div>
  <div class="acao">
    <select id="ser"></select><select id="tipo"></select><button id="enviar">Enviar em missão</button>
  </div><small id="msg" style="color:var(--m)"></small>
</section>
<ul id="feed"><li class="vazio">carregando…</li></ul>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const base=new URLSearchParams(location.search).get('base')||'';   // ex.: ?base=http://192.168.0.10:8810 no app/celular
let montado=false;
async function carregar(){
  try{
    const d=await (await fetch(base+'/api/feed',{cache:'no-store'})).json();
    const r=d.resumo;$('resumo').textContent=`Ciclo ${r.ciclo} · dia ${r.dia??'-'} · ${r.periodo??''} · ${r.clima??''}`;
    $('ativas').innerHTML=d.missoes.ativas.map(m=>`<div class="missao ${m.risco}"><span>${esc(m.titulo)} — ${esc(m.serId)}</span><span>${m.progresso}/${m.meta}</span></div>`).join('')||'<small style="color:var(--m)">Nenhuma missão ativa.</small>';
    if(!montado){
      $('tipo').innerHTML=Object.entries(d.missoes.catalogo).map(([k,v])=>`<option value="${k}">${esc(v.titulo)}${v.risco==='alto'?' ⚠️':''}</option>`).join('');
      const s=await (await fetch(base+'/api/snapshot')).json();
      $('ser').innerHTML=Object.entries(s.estado.seres||{}).map(([k,v])=>`<option value="${k}">${esc(v.nome||k)}</option>`).join('');montado=true;
    }
    $('feed').innerHTML=d.itens.map(i=>`<li class="${i.tipo==='missao'?'missao-i':i.tipo==='diretor'?'diretor':''}"><span class="i">${i.icone}</span><div>${esc(i.texto)}<small>ciclo ${i.ciclo}</small></div></li>`).join('')||'<li class="vazio">Nada aconteceu ainda.</li>';
  }catch(e){$('resumo').textContent='sem conexão com a Ilha…'}
}
$('enviar').onclick=async()=>{
  const r=await fetch(base+'/api/missao',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({serId:$('ser').value,tipoId:$('tipo').value})});
  const j=await r.json();$('msg').textContent=j.ok?'Missão enfileirada — começa no próximo ciclo.':'Erro: '+j.erro;
};
carregar();setInterval(carregar,4000);
</script></body></html>
