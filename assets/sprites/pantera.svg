<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100" height="60">
  <defs>
    <!-- Sombra suave no solo da floresta -->
    <radialGradient id="sombraPantera" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Pelagem de pantera negra com reflexos azulados/grafite de predador -->
    <linearGradient id="peloDorsal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="musculoFlanco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Sombra de Contato com o Chão -->
  <ellipse cx="50" cy="53" rx="38" ry="6" fill="url(#sombraPantera)"/>

  <!-- Pata Traseira Direita (Fundo) -->
  <path d="M26,32 Q22,42 16,52 L22,52 Q28,44 32,36 Z" fill="#090d16"/>

  <!-- Pata Dianteira Direita (Fundo) -->
  <path d="M64,30 Q68,40 72,52 L77,52 Q74,42 70,30 Z" fill="#090d16"/>

  <!-- Cauda Longa Sinuosa com Curva Fina Predatória -->
  <path d="M18,30 Q8,26 4,16 Q1,6 7,4 Q12,4 10,12 Q8,20 22,28 Z" fill="#0f172a" stroke="#090d16" stroke-width="1"/>

  <!-- Tronco Muscular Arqueado em Postura de Espreita -->
  <path d="M20,28 Q26,18 48,20 Q68,20 76,24 Q78,32 72,38 Q52,42 30,38 Q20,34 20,28 Z" fill="url(#peloDorsal)"/>

  <!-- Destaque Muscular da Escápula / Costas -->
  <path d="M42,21 Q54,21 64,24 Q56,30 46,28 Z" fill="#334155" opacity="0.4"/>

  <!-- Pata Traseira Esquerda (Primeiro Plano, Músculo da Coxa) -->
  <ellipse cx="28" cy="34" rx="8" ry="6" fill="url(#musculoFlanco)"/>
  <path d="M30,34 Q24,44 26,53 L32,53 Q34,44 38,36 Z" fill="url(#peloDorsal)"/>
  <ellipse cx="29" cy="53" rx="4" ry="2.2" fill="#090d16"/> <!-- Pata -->

  <!-- Pata Dianteira Esquerda (Primeiro Plano, Músculo do Ombro) -->
  <ellipse cx="68" cy="30" rx="7" ry="6" fill="url(#musculoFlanco)"/>
  <path d="M66,32 Q64,42 66,53 L72,53 Q73,42 74,32 Z" fill="url(#peloDorsal)"/>
  <ellipse cx="69" cy="53" rx="4" ry="2.2" fill="#090d16"/> <!-- Pata -->

  <!-- Pescoço Muscular e Cabeça Felina -->
  <path d="M72,22 Q80,16 88,22 Q92,30 86,34 Q78,36 72,28 Z" fill="url(#peloDorsal)"/>

  <!-- Focinho Elegante -->
  <path d="M86,23 Q94,25 90,30 Q85,32 84,27 Z" fill="#090d16"/>
  <circle cx="90.5" cy="26" r="1.5" fill="#f43f5e"/> <!-- Nariz Rosa-Escuro -->

  <!-- Orelhas Afiadas em Alerta -->
  <polygon points="79,16 82,9 86,16" fill="#090d16"/>
  <polygon points="82,15 83,11 85,15" fill="#f43f5e" opacity="0.7"/> <!-- Interior da Orelha -->
  <polygon points="74,18 76,13 80,18" fill="#1e293b"/>

  <!-- Olho Dourado Felino Brilhante com Pupila em Fenda -->
  <ellipse cx="84" cy="22" rx="2.8" ry="2.2" fill="#facc15"/>
  <line x1="84" y1="20.5" x2="84" y2="23.5" stroke="#000000" stroke-width="1.3"/>
  <circle cx="84.8" cy="21.2" r="0.6" fill="#ffffff"/> <!-- Brilho no Olhar -->
</svg>
