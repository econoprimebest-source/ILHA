<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <!-- Terreno demarcado com valas e estacas (Etapa 1 do Quebra-Cabeça) -->
  <ellipse cx="50" cy="54" rx="42" ry="16" fill="#000" opacity="0.25"/>
  <!-- Valas abertas na terra fértil -->
  <path d="M 18 48 L 48 34 L 82 48 L 52 64 Z" fill="#451a03" stroke="#78350f" stroke-width="2"/>
  <path d="M 24 48 L 48 37 L 76 48 L 52 60 Z" fill="#5c2e0b"/>
  <!-- Montículos de terra escavada -->
  <ellipse cx="20" cy="52" rx="6" ry="3" fill="#78350f"/>
  <ellipse cx="80" cy="52" rx="6" ry="3" fill="#78350f"/>
  <ellipse cx="52" cy="65" rx="8" ry="3.5" fill="#78350f"/>
  <!-- 4 Estacas de Madeira cravadas nos cantos -->
  <line x1="18" y1="52" x2="18" y2="34" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <line x1="48" y1="38" x2="48" y2="20" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <line x1="82" y1="52" x2="82" y2="34" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="66" x2="52" y2="46" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>
  <!-- Cordel amarelo fluorescente de prumo/alinhamento unindo as estacas -->
  <polyline points="18,36 48,22 82,36 52,48 18,36" fill="none" stroke="#facc15" stroke-width="1.8" stroke-dasharray="3,2"/>
  <!-- Placa de Obra autorizada -->
  <rect x="36" y="58" width="16" height="10" rx="1" fill="#fef08a" stroke="#854d0e" stroke-width="1"/>
  <line x1="44" y1="68" x2="44" y2="76" stroke="#78350f" stroke-width="2"/>
  <text x="44" y="65" font-size="6" font-family="sans-serif" font-weight="bold" fill="#78350f" text-anchor="middle">OBRA</text>
</svg>
