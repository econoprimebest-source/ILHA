  <path d="M14,26 Q50,22 86,26" stroke="#1c0e06" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M20,32 Q50,28 80,32" stroke="#1c0e06" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- Estacas rústicas de galho -->
