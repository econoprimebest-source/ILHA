      <stop offset="0%" stop-color="#382012" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#2a160a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1c0e06" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Montículo de terra fértil escavada (sem moldura de madeira) -->
