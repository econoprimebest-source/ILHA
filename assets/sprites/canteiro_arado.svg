  <line x1="86" y1="14" x2="86" y2="28" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="17" x2="86" y2="17" stroke="#fef3c7" stroke-width="0.8" opacity="0.4"/>
