  <line x1="32" y1="5" x2="32" y2="14" stroke="#5c2909" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="56" y1="6" x2="56" y2="14" stroke="#5c2909" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Corda curvada -->
  <path d="M 8,7 Q 20,10 32,7 Q 44,10 56,7" fill="none" stroke="#d97706" stroke-width="1.6"/>
