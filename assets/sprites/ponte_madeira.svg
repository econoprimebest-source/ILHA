  </defs>
  <!-- Sombra sob a ponte -->
  <ellipse cx="35" cy="30" rx="30" ry="6" fill="url(#sombraPonte)"/>
  <!-- Vigas de sustentação laterais -->
  <line x1="6" y1="26" x2="64" y2="26" stroke="#451a03" stroke-width="5" stroke-linecap="round"/>
  <line x1="6" y1="12" x2="64" y2="12" stroke="#451a03" stroke-width="5" stroke-linecap="round"/>
  <!-- Pranchas de Madeira transversais -->
  <rect x="8" y="10" width="6" height="18" rx="1" fill="#78350f" stroke="#381a05" stroke-width="0.8"/>
  <rect x="16" y="10" width="6" height="18" rx="1" fill="#92400e" stroke="#381a05" stroke-width="0.8"/>
  <rect x="24" y="10" width="6" height="18" rx="1" fill="#78350f" stroke="#381a05" stroke-width="0.8"/>
  <rect x="32" y="10" width="6" height="18" rx="1" fill="#b45309" stroke="#381a05" stroke-width="0.8"/>
  <rect x="40" y="10" width="6" height="18" rx="1" fill="#78350f" stroke="#381a05" stroke-width="0.8"/>
  <rect x="48" y="10" width="6" height="18" rx="1" fill="#92400e" stroke="#381a05" stroke-width="0.8"/>
  <rect x="56" y="10" width="6" height="18" rx="1" fill="#78350f" stroke="#381a05" stroke-width="0.8"/>
  <!-- Corrimão de Corda com estacas -->
