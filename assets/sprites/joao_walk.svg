<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80">
  <defs>
    <radialGradient id="sombra" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd0b5"/>
      <stop offset="100%" stop-color="#d49a7a"/>
    </linearGradient>
    <linearGradient id="tunicaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sombra no Chão -->
  <ellipse cx="32" cy="74" rx="20" ry="6" fill="url(#sombra)"/>

  <!-- Capa nas Costas -->
  <path d="M22,24 Q32,22 42,24 L46,56 Q32,61 18,56 Z" fill="#38bdf8" opacity="0.9" filter="url(#drop)"/>

  <!-- Pernas e Botas -->
  <!-- Perna Esquerda -->
  <rect x="23" y="54" width="7" height="18" rx="3" fill="#1c1917"/>
  <!-- Perna Direita -->
  <rect x="34" y="46" width="7" height="18" rx="3" fill="#1c1917"/>
  <!-- Solas -->
  <rect x="21" y="69" width="9" height="4" rx="2" fill="#111827"/>
  <rect x="34" y="61" width="9" height="4" rx="2" fill="#111827"/>

  <!-- Túnica Principal -->
  <path d="M20,26 Q32,24 44,26 L46,52 Q32,56 18,52 Z" fill="url(#tunicaGrad)" filter="url(#drop)"/>
  <line x1="32" y1="26" x2="32" y2="53" stroke="#0369a1" stroke-width="2"/>

  <!-- Cinto de Couro -->
  <rect x="18" y="38" width="28" height="6" rx="2" fill="#ffffff"/>
  <rect x="29" y="37" width="6" height="8" rx="1.5" fill="#fef08a" stroke="#b45309" stroke-width="1"/>

  <!-- Braço Esquerdo -->
  <rect x="14" y="26" width="6" height="16" rx="3" fill="url(#tunicaGrad)"/>
  <circle cx="17" cy="44" r="3.5" fill="url(#peleGrad)"/>

  <!-- Braço Direito (com Ferramenta se houver) -->
  <rect x="44" y="30" width="6" height="16" rx="3" fill="url(#tunicaGrad)"/>
  <circle cx="47" cy="48" r="3.5" fill="url(#peleGrad)"/>

  <!-- Ferramenta na Mão Direita -->
  
    <!-- Lança de Madeira e Ponta de Pedra -->
    <rect x="49" y="10" width="3" height="48" rx="1" fill="#78350f" transform="rotate(8 49 36)"/>
    <polygon points="50,8 46,18 54,18" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  

  <!-- Pescoço -->
  <rect x="29" y="20" width="6" height="7" rx="2" fill="url(#peleGrad)"/>

  <!-- Cabeça e Rosto -->
  <ellipse cx="32" cy="16" rx="10" ry="11" fill="url(#peleGrad)" filter="url(#drop)"/>

  <!-- Cabelo Detalhado -->
  <path d="M22,14 Q32,4 42,14 Q44,22 42,18 Q32,12 22,18 Z" fill="#1e293b"/>
  

  <!-- Olhos e Expressão -->
  <ellipse cx="28" cy="16" rx="1.5" ry="2" fill="#0f172a"/>
  <ellipse cx="36" cy="16" rx="1.5" ry="2" fill="#0f172a"/>
  <circle cx="28.5" cy="15.5" r="0.5" fill="#ffffff"/>
  <circle cx="36.5" cy="15.5" r="0.5" fill="#ffffff"/>

  <!-- Boca Expressiva -->
  <path d="M30,21 Q32,23 34,21" stroke="#991b1b" stroke-width="1" fill="none"/>
</svg>