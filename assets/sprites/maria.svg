<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 80" width="64" height="80">
  <defs>
    <radialGradient id="sombra" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="peleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde0cf"/>
      <stop offset="100%" stop-color="#d49a7a"/>
    </linearGradient>
    <linearGradient id="tunicaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sombra no Chão -->
  <ellipse cx="32" cy="74" rx="20" ry="6" fill="url(#sombra)"/>

  <!-- Capa nas Costas -->
  <path d="M22,26 Q32,24 42,26 L46,58 Q32,63 18,58 Z" fill="#f43f5e" opacity="0.9" filter="url(#drop)"/>

  <!-- Pernas e Botas -->
  <!-- Perna Esquerda -->
  <rect x="23" y="52" width="7" height="18" rx="3" fill="#451a03"/>
  <!-- Perna Direita -->
  <rect x="34" y="52" width="7" height="18" rx="3" fill="#451a03"/>
  <!-- Solas -->
  <rect x="21" y="67" width="9" height="4" rx="2" fill="#111827"/>
  <rect x="34" y="67" width="9" height="4" rx="2" fill="#111827"/>

  <!-- Túnica Principal -->
  <path d="M20,28 Q32,26 44,28 L46,54 Q32,58 18,54 Z" fill="url(#tunicaGrad)" filter="url(#drop)"/>
  <line x1="32" y1="28" x2="32" y2="55" stroke="#be123c" stroke-width="2"/>

  <!-- Cinto de Couro -->
  <rect x="18" y="40" width="28" height="6" rx="2" fill="#fde047"/>
  <rect x="29" y="39" width="6" height="8" rx="1.5" fill="#fef08a" stroke="#b45309" stroke-width="1"/>

  <!-- Braço Esquerdo -->
  <rect x="14" y="30" width="6" height="16" rx="3" fill="url(#tunicaGrad)"/>
  <circle cx="17" cy="48" r="3.5" fill="url(#peleGrad)"/>

  <!-- Braço Direito (com Ferramenta se houver) -->
  <rect x="44" y="30" width="6" height="16" rx="3" fill="url(#tunicaGrad)"/>
  <circle cx="47" cy="48" r="3.5" fill="url(#peleGrad)"/>

  <!-- Ferramenta na Mão Direita -->
  
    <!-- Cabo da Enxada -->
    <rect x="49" y="20" width="3.5" height="38" rx="1" fill="#78350f" transform="rotate(-12 49 38)"/>
    <rect x="42" y="18" width="14" height="4" rx="1" fill="#64748b"/>
  

  <!-- Pescoço -->
  <rect x="29" y="22" width="6" height="7" rx="2" fill="url(#peleGrad)"/>

  <!-- Cabeça e Rosto -->
  <ellipse cx="32" cy="18" rx="10" ry="11" fill="url(#peleGrad)" filter="url(#drop)"/>

  <!-- Cabelo Detalhado -->
  <path d="M22,16 Q32,6 42,16 Q44,24 42,20 Q32,14 22,20 Z" fill="#713f12"/>
  
    <!-- Coque / Cabelo Preso -->
    <circle cx="32" cy="7" r="5" fill="#713f12"/>
  

  <!-- Olhos e Expressão -->
  <ellipse cx="28" cy="18" rx="1.5" ry="2" fill="#0f172a"/>
  <ellipse cx="36" cy="18" rx="1.5" ry="2" fill="#0f172a"/>
  <circle cx="28.5" cy="17.5" r="0.5" fill="#ffffff"/>
  <circle cx="36.5" cy="17.5" r="0.5" fill="#ffffff"/>

  <!-- Boca Expressiva -->
  <path d="M30,23 Q32,25 34,23" stroke="#991b1b" stroke-width="1" fill="none"/>
</svg>