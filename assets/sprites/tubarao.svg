<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 60" width="130" height="60">
  <defs>
    <!-- Gradiente do dorso do tubarão (Countershading azul-marinho profundo) -->
    <linearGradient id="peleTubarao" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#091e3a"/>
      <stop offset="40%" stop-color="#142c4c"/>
      <stop offset="85%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f233d"/>
    </linearGradient>

    <!-- Brilho cáustico de água incidindo no dorso -->
    <linearGradient id="brilhoDorso" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Sombra subaquática difusa do predador -->
    <radialGradient id="sombraAgua" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#031628" stop-opacity="0.55"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Sombra e halo de profundidade subaquática -->
  <ellipse cx="64" cy="30" rx="60" ry="24" fill="url(#sombraAgua)"/>

  <!-- 2. Nadadeiras Peitorais Laterais Submersas (Visão Superior / Isométrica) -->
  <!-- Peitoral Esquerda (superior) -->
  <path d="M58,26 Q54,10 40,4 Q52,14 68,25 Z" fill="#0c233c" opacity="0.85"/>
  <!-- Peitoral Direita (inferior) -->
  <path d="M58,34 Q54,50 40,56 Q52,46 68,35 Z" fill="#081a2f" opacity="0.9"/>

  <!-- 3. Nadadeiras Pélvicas e Estabilizadores Traseiros -->
  <path d="M30,27 Q25,20 18,17 Q24,24 33,28 Z" fill="#0c233c" opacity="0.8"/>
  <path d="M30,33 Q25,40 18,43 Q24,36 33,32 Z" fill="#081a2f" opacity="0.85"/>

  <!-- 4. Cauda / Barbatana Caudal Poderosa em Foice -->
  <path d="M22,30 Q14,24 6,10 Q14,26 19,30 Q14,34 6,50 Q14,36 22,30 Z" fill="#0a1d33"/>
  <path d="M20,30 Q14,26 8,14 Q14,27 18,30 Q14,33 8,46 Q14,34 20,30 Z" fill="#1e3a5f" opacity="0.6"/>

  <!-- 5. Corpo Fusiforme Hidrodinâmico Principal (Silhueta Perfeita de Tubarão) -->
  <!-- Nariz afilado no ponto (116, 30), corpo curvando suavemente -->
  <path d="M116,30 Q105,21 82,21 Q55,22 36,26 Q24,28 18,30 Q24,32 36,34 Q55,38 82,39 Q105,39 116,30 Z" fill="url(#peleTubarao)"/>

  <!-- 6. Realce Cáustico no Dorso (Efeito de Refração de Luz Solar na Água) -->
  <path d="M106,30 Q85,25 58,26 Q40,28 26,30 Q40,32 58,34 Q85,35 106,30 Z" fill="url(#brilhoDorso)"/>

  <!-- 7. Crista e Barbatana Dorsal Afiada (Cortando o Fluxo) -->
  <!-- A barbatana dorsal vista levemente em ângulo isométrico -->
  <path d="M72,30 Q63,28 55,22 Q58,29 65,30 Q58,31 55,38 Q63,32 72,30 Z" fill="#030c18"/>
  <path d="M70,30 L56,23 L62,30 Z" fill="#38bdf8" opacity="0.35"/>

  <!-- 8. Fendas Branquiais Curvas Submersas nos Dois Lados -->
  <path d="M78,24 Q79,27 78,28" stroke="#061526" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M82,24 Q83,27 82,28" stroke="#061526" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M86,24 Q87,27 86,28" stroke="#061526" stroke-width="1.2" fill="none" opacity="0.7"/>

  <path d="M78,32 Q79,33 78,36" stroke="#061526" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M82,32 Q83,33 82,36" stroke="#061526" stroke-width="1.2" fill="none" opacity="0.7"/>
  <path d="M86,32 Q87,33 86,36" stroke="#061526" stroke-width="1.2" fill="none" opacity="0.7"/>

  <!-- 9. Olhos Laterais Predatórios -->
  <circle cx="103" cy="24" r="1.8" fill="#020813"/>
  <circle cx="103" cy="36" r="1.8" fill="#020813"/>
  <circle cx="103.5" cy="23.6" r="0.6" fill="#38bdf8" opacity="0.9"/>
  <circle cx="103.5" cy="35.6" r="0.6" fill="#38bdf8" opacity="0.9"/>

  <!-- 10. Ponta do Nariz com Sensor Eletromagnético (Ampolas de Lorenzini) -->
  <circle cx="114" cy="29" r="0.7" fill="#071b30"/>
  <circle cx="114" cy="31" r="0.7" fill="#071b30"/>
  <circle cx="111" cy="30" r="0.7" fill="#071b30"/>
</svg>