<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 90" width="100" height="90">
  <defs>
    <filter id="glowFish" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Sombra no solo/água -->
  <ellipse cx="50" cy="80" rx="36" ry="8" fill="#000" opacity="0.35"/>
  <!-- Ondas da água onde o peixe foi fisgado -->
  <ellipse cx="68" cy="74" rx="20" ry="5" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
  <ellipse cx="68" cy="74" rx="12" ry="3" fill="none" stroke="#67e8f9" stroke-width="1.5" opacity="0.6"/>
  <!-- Vara de Pesca em arco curvado com tensão -->
  <path d="M 24 64 Q 42 22, 65 18" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <!-- Linha de Pesca tensionada -->
  <path d="M 65 18 Q 72 32, 68 46" fill="none" stroke="#e0f2fe" stroke-width="1.5" stroke-dasharray="2,1"/>
  <!-- Peixe Fisgado Erguido no Ar com Brilho -->
  <g filter="url(#glowFish)">
    <!-- Corpo do Peixe -->
    <path d="M 68 46 C 78 40, 80 54, 68 56 C 60 54, 58 42, 68 46 Z" fill="url(#fishGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Cauda -->
    <polygon points="60,49 52,43 54,55" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
    <!-- Nadadeira dorsal -->
    <path d="M 68 44 Q 72 38, 76 43" fill="#f59e0b"/>
    <!-- Olho brilhante -->
    <circle cx="73" cy="47" r="1.8" fill="#ffffff"/>
    <circle cx="73.5" cy="47" r="0.8" fill="#0369a1"/>
  </g>
  <!-- Gotículas de Água espirrando -->
  <circle cx="62" cy="40" r="1.5" fill="#67e8f9" opacity="0.9"/>
  <circle cx="76" cy="36" r="1.2" fill="#bae6fd" opacity="0.9"/>
  <circle cx="74" cy="58" r="1.4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="58" cy="58" r="1.2" fill="#67e8f9" opacity="0.7"/>
  <!-- Anzol e Isca -->
  <path d="M 72 49 Q 74 53, 71 54" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
</svg>
