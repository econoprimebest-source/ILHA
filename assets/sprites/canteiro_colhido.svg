  <polygon points="76,16 84,18 80,25" fill="#f97316"/>
  <circle cx="73" cy="18" r="2" fill="#16a34a"/>
  <circle cx="81" cy="17" r="2" fill="#16a34a"/>

  <!-- Cesto 2 -->
