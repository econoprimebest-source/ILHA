<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <defs>
    <radialGradient id="sombraPalm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sombra no solo -->
  <ellipse cx="40" cy="94" rx="22" ry="5.5" fill="url(#sombraPalm)"/>
  <!-- Tronco Curvado Tropical com gomos -->
  <path d="M 40,94 Q 48,65 36,36 Q 34,30 38,22" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
  <path d="M 40,94 Q 48,65 36,36 Q 34,30 38,22" fill="none" stroke="#92400e" stroke-width="5" stroke-linecap="round"/>
  <!-- Anéis do tronco -->
  <line x1="39" y1="85" x2="45" y2="84" stroke="#451a03" stroke-width="1.8"/>
  <line x1="42" y1="72" x2="48" y2="70" stroke="#451a03" stroke-width="1.8"/>
  <line x1="42" y1="58" x2="47" y2="55" stroke="#451a03" stroke-width="1.8"/>
  <line x1="37" y1="44" x2="41" y2="41" stroke="#451a03" stroke-width="1.8"/>
  <!-- Cocos -->
  <circle cx="36" cy="24" r="3" fill="#451a03"/>
  <circle cx="41" cy="23" r="2.8" fill="#5c2909"/>
  <!-- Folhagem em leque (Copas curvas) -->
  <!-- Folha 1 (Esquerda baixa) -->
  <path d="M 38,22 Q 18,22 6,34 Q 18,28 38,22" fill="#15803d" stroke="#14532d" stroke-width="0.8"/>
  <!-- Folha 2 (Esquerda alta) -->
  <path d="M 38,22 Q 14,10 8,16 Q 22,14 38,22" fill="#16a34a" stroke="#15803d" stroke-width="0.8"/>
  <!-- Folha 3 (Cima central) -->
  <path d="M 38,22 Q 36,4 40,2 Q 42,8 38,22" fill="#22c55e" stroke="#16a34a" stroke-width="0.8"/>
  <!-- Folha 4 (Direita alta) -->
  <path d="M 38,22 Q 58,8 72,16 Q 60,16 38,22" fill="#16a34a" stroke="#15803d" stroke-width="0.8"/>
  <!-- Folha 5 (Direita baixa) -->
  <path d="M 38,22 Q 62,26 74,38 Q 58,30 38,22" fill="#15803d" stroke="#14532d" stroke-width="0.8"/>
</svg>